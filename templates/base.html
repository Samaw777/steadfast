{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="A private space to track your streak, check in daily, and grow in the Word.">
  <meta name="theme-color" content="#0a1214">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235fd3a1' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M11 20a10 10 0 0010-10 25.9 25.9 0 00-1.04-7.281 1 1 0 00-1.755-.325C15.833 5.5 13 5.5 9.8 6.1A7 7 0 0011 20'/%3E%3Cpath d='M2 21a5 5 0 012.911-4.544C7.613 15.212 8.351 15.24 11 13'/%3E%3C/svg%3E">
  <title>{% block title %}Steadfast{% endblock %}</title>
  <script>
    // Tell the server the browser's timezone so "today" matches the person's clock.
    (function () {
      var tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
      var match = document.cookie.match(/(?:^|; )tz=([^;]*)/);
      var current = match && decodeURIComponent(match[1]);
      if (!tz || current === tz) return;
      document.cookie = "tz=" + encodeURIComponent(tz) + "; path=/; max-age=31536000; samesite=lax";
      // Reload once so this first page renders in the right timezone too.
      if (document.cookie.indexOf("tz=") !== -1 && !current) location.reload();
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
  <div class="aurora" aria-hidden="true"></div>
  {% block body %}{% endblock %}
</body>
</html>
