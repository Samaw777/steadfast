{% extends "auth.html" %}
{% load icons %}

{% block title %}Reset password · Steadfast{% endblock %}

{% block content %}
<h1>Reset password</h1>
<p class="lede">Enter your email and we'll send you a link to set a new password.</p>

<form method="post" class="form">
  {% csrf_token %}
  <input type="email" name="email" value="{{ form.email.value|default:'' }}" placeholder="you@example.com" autocomplete="email" required autofocus>
  {% include "registration/_errors.html" %}
  <button type="submit" class="btn btn-primary">Send reset link {% icon "arrow-right" 16 %}</button>
</form>

<a class="link switch" href="{% url 'login' %}">Back to sign in</a>
{% endblock %}
